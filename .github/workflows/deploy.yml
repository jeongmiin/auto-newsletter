name: Deploy master to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# gh-pages 브랜치로 푸시하기 위한 쓰기 권한
permissions:
  contents: write

# master·develop 배포가 같은 gh-pages 브랜치를 건드리므로 직렬화(동시 푸시 충돌 방지)
concurrency:
  group: 'gh-pages-deploy'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (base=/auto-newsletter/)
        run: npm run build
        env:
          NODE_ENV: production
          DEPLOY_BASE: /auto-newsletter/

      - name: Verify build output
        run: |
          echo "📁 dist 구조"; ls -laR dist/ | head -50
          if [ -d "dist/modules" ]; then
            echo "✅ modules 폴더 존재 ($(ls -1 dist/modules/ | wc -l)개)"
          else
            echo "❌ ERROR: modules 폴더가 없습니다!"; exit 1
          fi

      # gh-pages 브랜치의 '루트'에 배포. keep_files=true 라 /develop 하위 미리보기는 보존한다.
      - name: Deploy to gh-pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
          commit_message: 'deploy(master): ${{ github.sha }}'
