<!-- 설명 텍스트 모듈 -->
<table align="center" border="0" cellpadding="0" cellspacing="0"
  style="max-width:680px; width:100%; border-collapse:collapse; table-layout:fixed;" width="100%">
  <tbody>
    <tr>
      <td
        style="padding:{{marginTop}} {{marginRight}} {{marginBottom}} {{marginLeft}}; box-sizing: border-box; font-size:{{fontSize}}; font-weight:400; color:{{textColor}}; word-break:keep-all; word-wrap:break-word; overflow-wrap:break-word; letter-spacing:-0.03em; font-family:AppleSDGothic, malgun gothic, nanum gothic, Noto Sans KR, sans-serif;">
        <div style="background-color:{{bgColor}}; padding:{{paddingTop}} {{paddingRight}} {{paddingBottom}} {{paddingLeft}}; border-radius:{{borderRadius}}; box-sizing: border-box;">
          {{descriptionText}}
        </div>
      </td>
    </tr>
  </tbody>
</table>
