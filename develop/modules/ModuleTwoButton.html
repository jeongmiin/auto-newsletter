<!-- 2개 버튼 모듈 -->
<table align="center" border="0" cellpadding="0" cellspacing="0"
  style="max-width:680px; width:100%; border-collapse:collapse;" width="100%">
  <tbody>
    <tr>
      <td style="padding:{{paddingTop}} {{paddingRight}} {{paddingBottom}} {{paddingLeft}}; box-sizing: border-box;" align="center">
        <!-- 버튼 안쪽 여백·배경·테두리는 <a>가 아니라 <td>에 둔다.
             <a>는 인라인 요소라 아웃룩 등 일부 메일 클라이언트가 위아래 여백을 무시해
             버튼이 납작하게 나온다. <td> 여백은 모든 클라이언트가 지킨다. -->
        <div
          style="display: inline-block; margin:0px; vertical-align:top; border-collapse:collapse; padding:5px; box-sizing: border-box; min-width: calc(50% - 5px); max-width: 100%; width: calc((570px - 100%) * 570);">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
            style="width:100%; border-collapse:separate; border-spacing:0;">
            <tbody>
              <tr>
                <td align="center"
                  style="padding:{{button1PaddingTop}} {{button1PaddingRight}} {{button1PaddingBottom}} {{button1PaddingLeft}}; background-color:{{button1BgColor}}; border:{{button1BorderWidth}} {{button1BorderStyle}} {{button1BorderColor}}; border-radius:{{button1BorderRadiusCss}}; text-align:center; box-sizing: border-box;">
                  <a href="{{button1Url}}"
                    style="display: block; text-decoration:none; font-family: AppleSDGothic, malgun gothic, nanum gothic, Noto Sans KR, sans-serif; color:{{button1TextColor}}; font-size:{{button1FontSize}}; font-weight:700;"
                    target="_blank">{{button1Text}}</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div
          style="display: inline-block; margin:0px; vertical-align:top; border-collapse:collapse; padding:5px; box-sizing: border-box; min-width: calc(50% - 5px); max-width: 100%; width: calc((570px - 100%) * 570);">
          <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%"
            style="width:100%; border-collapse:separate; border-spacing:0;">
            <tbody>
              <tr>
                <td align="center"
                  style="padding:{{button2PaddingTop}} {{button2PaddingRight}} {{button2PaddingBottom}} {{button2PaddingLeft}}; background-color:{{button2BgColor}}; border:{{button2BorderWidth}} {{button2BorderStyle}} {{button2BorderColor}}; border-radius:{{button2BorderRadiusCss}}; text-align:center; box-sizing: border-box;">
                  <a href="{{button2Url}}"
                    style="display: block; text-decoration:none; font-family: AppleSDGothic, malgun gothic, nanum gothic, Noto Sans KR, sans-serif; color:{{button2TextColor}}; font-size:{{button2FontSize}}; font-weight:700;"
                    target="_blank">{{button2Text}}</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<!-- //2개 버튼 모듈 -->
